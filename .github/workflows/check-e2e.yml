name: check-e2e

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install workspace dependencies
        run: pnpm install
      - name: Build native artifacts
        run: pnpm build:napi
      - name: Run the end-to-end suite
        shell: bash
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee e2e.log
      - name: Enforce the end-to-end floor
        run: node scripts/ci/check-e2e-floor.mjs e2e.log 121
      - name: Upload the end-to-end log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panduck-e2e-log
          path: e2e.log
