[workspace]
resolver = "2"
members = [
    "projects/panduck.rs/panduck-napi",
    "projects/panduck.rs/panduck-wasm",
]
default-members = [
    "projects/panduck.rs/panduck-napi",
]

[workspace.package]
version = "0.0.18"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"
edition = "2024"

[workspace.dependencies]
# Overlaid by local path `.cargo/config.toml` (git ignored).
boost-diagnostic = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86", default-features = false, features = ["std", "serde"] }
boost-log = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86" }
# Document family implementation. Pinned to `document.rs` so the local tree keeps only the Node-API adapter.
document-convert = { git = "https://github.com/notedge/document.rs", rev = "34e0c25de2807ba8beaf24a9415f55c21b311894" }
document-diagnostic = { git = "https://github.com/notedge/document.rs", rev = "34e0c25de2807ba8beaf24a9415f55c21b311894", default-features = false }
document-types = { git = "https://github.com/notedge/document.rs", rev = "34e0c25de2807ba8beaf24a9415f55c21b311894" }

# External dependencies
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-derive = "3.6.12"

[profile.release]
lto = true
opt-level = "s"

[workspace.metadata.release]
push = false
tag = false
