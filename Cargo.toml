[workspace]
resolver = "2"
members = [
    "projects/panduck.rs/panduck-napi",
    "projects/panduck.rs/panduck-wasm",
]
default-members = [
    "projects/panduck.rs/panduck-napi",
]

[workspace.package]
version = "0.0.18"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"
edition = "2024"

[workspace.dependencies]
# Overlaid by local path `.cargo/config.toml` (git ignored).
boost-diagnostic = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86", default-features = false, features = ["std", "serde"] }
boost-log = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86" }
# Document grammar lexers. Pinned to the same `oak.rs` revision that the `document-*`
# pins below resolve, so the token stream matches what the readers actually accept.
# Bump this block together with the `document-*` revs whenever either side moves.
oak-core = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "5c6019f0d9086250e626b4c3f5a0c9b1d316b29a" }
oak-notedown = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "5c6019f0d9086250e626b4c3f5a0c9b1d316b29a", default-features = false, features = ["serde"] }
oak-markdown = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "5c6019f0d9086250e626b4c3f5a0c9b1d316b29a", default-features = false, features = ["serde"] }
oak-html = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "5c6019f0d9086250e626b4c3f5a0c9b1d316b29a", default-features = false, features = ["serde"] }
oak-xml = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "5c6019f0d9086250e626b4c3f5a0c9b1d316b29a", default-features = false, features = ["serde"] }

# Document family implementation. Pinned to `document.rs` so the local tree keeps only the Node-API adapter.
document-convert = { git = "https://github.com/notedge/document.rs", rev = "b4b5d5d791baa38d7ca745728295122d0a21fed6" }
plotter-diagram = { git = "https://github.com/notedge/document.rs", rev = "b4b5d5d791baa38d7ca745728295122d0a21fed6" }
plotter-chart = { git = "https://github.com/notedge/document.rs", rev = "b4b5d5d791baa38d7ca745728295122d0a21fed6", features = ["vega-lite"] }
plotter-input-dot = { git = "https://github.com/notedge/document.rs", rev = "b4b5d5d791baa38d7ca745728295122d0a21fed6" }
plotter-input-tikz = { git = "https://github.com/notedge/document.rs", rev = "b4b5d5d791baa38d7ca745728295122d0a21fed6" }
plotter-input-mermaid = { git = "https://github.com/notedge/document.rs", rev = "b4b5d5d791baa38d7ca745728295122d0a21fed6" }
plotter-input-plantuml = { git = "https://github.com/notedge/document.rs", rev = "b4b5d5d791baa38d7ca745728295122d0a21fed6" }
plotter-runtime = { git = "https://github.com/notedge/document.rs", rev = "b4b5d5d791baa38d7ca745728295122d0a21fed6" }
plotter-scene = { git = "https://github.com/notedge/document.rs", rev = "b4b5d5d791baa38d7ca745728295122d0a21fed6" }
plotter-types = { git = "https://github.com/notedge/document.rs", rev = "b4b5d5d791baa38d7ca745728295122d0a21fed6" }
document-diagnostic = { git = "https://github.com/notedge/document.rs", rev = "b4b5d5d791baa38d7ca745728295122d0a21fed6", default-features = false }
document-fonts = { git = "https://github.com/notedge/document.rs", rev = "b4b5d5d791baa38d7ca745728295122d0a21fed6" }
document-ir = { git = "https://github.com/notedge/document.rs", rev = "b4b5d5d791baa38d7ca745728295122d0a21fed6" }
document-types = { git = "https://github.com/notedge/document.rs", rev = "b4b5d5d791baa38d7ca745728295122d0a21fed6" }

# External dependencies
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-derive = "3.6.12"

[profile.release]
lto = true
opt-level = "s"

[workspace.metadata.release]
push = false
tag = false
