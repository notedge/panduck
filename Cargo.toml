[workspace]
edition = "2021"
resolver = "2"
members = ["projects/crates/*"]
default-members = [
	"projects/crates/panduck-core",
	"projects/crates/panduck-napi",
]

[workspace.dependencies]
# Git `branch = "dev"` for CI and published consumers. Local path overlay: `.cargo/config.toml`.
panduck-core = { git = "https://github.com/notedge/panduck.git", branch = "dev", package = "panduck-core" }
panduck-napi = { git = "https://github.com/notedge/panduck.git", branch = "dev", package = "panduck-napi" }
panduck-wasm = { git = "https://github.com/notedge/panduck.git", branch = "dev", package = "panduck-wasm" }

[profile.release]
lto = true
opt-level = "s"

[workspace.metadata.release]
push = false
tag = false
