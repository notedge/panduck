[workspace]
resolver = "2"
members = ["projects/crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"
edition = "2021"
default-members = [
	"projects/crates/panduck-types",
	"projects/crates/panduck-convert",
	"projects/crates/panduck-napi",
]

[workspace.dependencies]
panduck-types = { path = "projects/crates/panduck-types" }
panduck-diagnostic = { path = "projects/crates/panduck-diagnostic" }
diagnostic = { git = "https://github.com/oovm/diagnostic-rs", branch = "dev", package = "diagnostic", default-features = false, features = ["std", "serde"] }
panduck-convert = { path = "projects/crates/panduck-convert" }
panduck-napi = { path = "projects/crates/panduck-napi" }
acorn-core = { git = "https://github.com/yggdrasil-language/acorn.rs.git", branch = "dev" }
acorn-docx = { git = "https://github.com/yggdrasil-language/acorn.rs.git", branch = "dev", package = "acorn-docx" }
panduck-wasm = { path = "projects/crates/panduck-wasm" }

# CI resolves git `branch = "dev"`. Local path overlay: `.cargo/config.toml` (gitignored).
oak-core = { git = "https://github.com/yggdrasil-language/oaks.git", branch = "dev" }
oak-navigation = { git = "https://github.com/yggdrasil-language/oaks.git", branch = "dev" }
oak-markdown = { git = "https://github.com/yggdrasil-language/oaks.git", branch = "dev", default-features = false, features = ["serde"] }
oak-rst = { git = "https://github.com/yggdrasil-language/oaks.git", branch = "dev", default-features = false, features = ["serde"] }
notedown-ir = { git = "https://github.com/notedge/notedown.git", branch = "dev" }
notedown-formats = { git = "https://github.com/notedge/notedown.git", branch = "dev", package = "notedown-formats", default-features = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

[profile.release]
lto = true
opt-level = "s"

[workspace.metadata.release]
push = false
tag = false
