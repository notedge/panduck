[workspace]
resolver = "2"
members = [
    "projects/panduck.rs/crates/*",
    "projects/panduck.rs/exports/*",
]
default-members = [
    "projects/panduck.rs/crates/panduck",
    "projects/panduck.rs/crates/panduck-types",
    "projects/panduck.rs/crates/panduck-convert",
    "projects/panduck.rs/exports/panduck-napi",
]

[workspace.package]
version = "0.0.18"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"
edition = "2024"

[workspace.dependencies]
# Overlaid by local path `.cargo/config.toml` (git ignored).
boost-diagnostic = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86", default-features = false, features = ["std", "serde"] }
boost-log = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86" }
# Overlaid by local path `.cargo/config.toml` (git ignored).
panduck = { path = "projects/panduck.rs/crates/panduck" }
panduck-types = { path = "projects/panduck.rs/crates/panduck-types" }
panduck-diagnostic = { path = "projects/panduck.rs/crates/panduck-diagnostic" }
panduck-convert = { path = "projects/panduck.rs/crates/panduck-convert" }
panduck-napi = { path = "projects/panduck.rs/exports/panduck-napi" }
panduck-wasm = { path = "projects/panduck.rs/exports/panduck-wasm" }
# Overlaid by local path `.cargo/config.toml` (git ignored).
notedown-ir = { git = "https://github.com/notedge/notedown.git", rev = "f46c6bd480afbc4243ea104d2cd34ff4f6cf03bb" }
notedown-formats = { git = "https://github.com/notedge/notedown.git", rev = "f46c6bd480afbc4243ea104d2cd34ff4f6cf03bb", default-features = false, features = ["markdown", "notedown", "docx", "doc", "pdf", "epub", "html"] }
notedown-fixtures = { git = "https://github.com/notedge/notedown.git", rev = "f46c6bd480afbc4243ea104d2cd34ff4f6cf03bb" }
# DaVinci diagram chain (same repository, same rev as notedown-*).
davinci-diagram = { git = "https://github.com/notedge/notedown.git", rev = "f46c6bd480afbc4243ea104d2cd34ff4f6cf03bb" }
davinci-chart = { git = "https://github.com/notedge/notedown.git", rev = "f46c6bd480afbc4243ea104d2cd34ff4f6cf03bb", features = ["vega-lite"] }
# OCF container metadata for EPUB budget enforcement (same rev as notedown).
acorn-epub = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "fbed2df1626ec3800cb2e54b7b9c730bf8a2f996" }
davinci-types = { git = "https://github.com/notedge/notedown.git", rev = "f46c6bd480afbc4243ea104d2cd34ff4f6cf03bb" }

# External dependencies
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = { version = "2.5.7", features = ["serde"] }
source-map = "0.15.0"
byteorder = "1.5.0"
blake3 = "1.8.7"
wasm-bindgen = "0.2.129"
napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-derive = "3.6.12"

[profile.release]
lto = true
opt-level = "s"

[workspace.metadata.release]
push = false
tag = false

