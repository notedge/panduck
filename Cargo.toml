[workspace]
resolver = "2"
members = [
    "projects/panduck.rs/panduck-napi",
    "projects/panduck.rs/panduck-wasm",
]
default-members = [
    "projects/panduck.rs/panduck-napi",
]

[workspace.package]
version = "0.0.19"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"
edition = "2024"

[workspace.dependencies]
# Overlaid by local path `.cargo/config.toml` (git ignored).
boost-diagnostic = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86", default-features = false, features = ["std", "serde"] }
boost-log = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86" }
# Document grammar lexers. Pinned to the same `oak.rs` revision that the `document-*`
# pins below resolve, so the token stream matches what the readers actually accept.
# Bump this block together with the `document-*` revs whenever either side moves.
oak-core = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "9058d71dc97f6fdd23d2b4c9325ebac15f4ba8c4" }
oak-notedown = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "9058d71dc97f6fdd23d2b4c9325ebac15f4ba8c4", default-features = false, features = ["serde"] }
oak-markdown = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "9058d71dc97f6fdd23d2b4c9325ebac15f4ba8c4", default-features = false, features = ["serde"] }
oak-html = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "9058d71dc97f6fdd23d2b4c9325ebac15f4ba8c4", default-features = false, features = ["serde"] }
oak-xml = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "9058d71dc97f6fdd23d2b4c9325ebac15f4ba8c4", default-features = false, features = ["serde"] }

# Document family implementation. Pinned to `document.rs` so the local tree keeps only the Node-API adapter.
document-convert = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c" }
document-formats = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c" }
plotter-diagram = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c" }
plotter-chart = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c", features = ["vega-lite"] }
plotter-input-dot = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c" }
plotter-input-tikz = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c" }
plotter-input-mermaid = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c" }
plotter-input-plantuml = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c" }
plotter-runtime = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c" }
plotter-scene = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c" }
plotter-types = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c" }
document-diagnostic = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c", default-features = false }
document-fonts = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c" }
document-ir = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c" }
document-layout = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c" }
document-types = { git = "https://github.com/notedge/document.rs", rev = "b750d2df75fb515a0bad276ccd85e7191124fc9c" }

# External dependencies
blake3 = "1.8.2"
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
# `dyn-symbols` keeps `cargo test` linkable on Linux and macOS, where the
# delay-load trick that resolves `napi_*` symbols on Windows does not exist.
napi = { version = "3.14.2", default-features = false, features = ["napi4", "dyn-symbols"] }
napi-derive = "3.6.12"

[profile.release]
lto = true
opt-level = "s"

[workspace.metadata.release]
push = false
tag = false
