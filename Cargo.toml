[workspace]
resolver = "2"
members = [
    "projects/panduck.rs/panduck-napi",
    "projects/panduck.rs/panduck-wasm",
]
default-members = [
    "projects/panduck.rs/panduck-napi",
]

[workspace.package]
version = "0.0.18"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"
edition = "2024"

[workspace.dependencies]
# Overlaid by local path `.cargo/config.toml` (git ignored).
boost-diagnostic = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86", default-features = false, features = ["std", "serde"] }
boost-log = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86" }
# Document grammar lexers. Pinned to the same `oak.rs` revision the document family uses
# so the published token stream matches what the readers actually accept.
oak-core = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "d1f43f4aafcc0902d7b21ac267a64c38e2c3f73c" }
oak-notedown = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "d1f43f4aafcc0902d7b21ac267a64c38e2c3f73c", default-features = false, features = ["serde"] }
oak-markdown = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "d1f43f4aafcc0902d7b21ac267a64c38e2c3f73c", default-features = false, features = ["serde"] }
oak-html = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "d1f43f4aafcc0902d7b21ac267a64c38e2c3f73c", default-features = false, features = ["serde"] }
oak-xml = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "d1f43f4aafcc0902d7b21ac267a64c38e2c3f73c", default-features = false, features = ["serde"] }

# Document family implementation. Pinned to `document.rs` so the local tree keeps only the Node-API adapter.
document-convert = { git = "https://github.com/notedge/document.rs", rev = "4e15d61abe00cc85762b13445cd485369c1e3389" }
plotter-diagram = { git = "https://github.com/notedge/document.rs", rev = "4e15d61abe00cc85762b13445cd485369c1e3389" }
plotter-chart = { git = "https://github.com/notedge/document.rs", rev = "4e15d61abe00cc85762b13445cd485369c1e3389", features = ["vega-lite"] }
plotter-input-dot = { git = "https://github.com/notedge/document.rs", rev = "4e15d61abe00cc85762b13445cd485369c1e3389" }
plotter-input-tikz = { git = "https://github.com/notedge/document.rs", rev = "4e15d61abe00cc85762b13445cd485369c1e3389" }
plotter-input-mermaid = { git = "https://github.com/notedge/document.rs", rev = "4e15d61abe00cc85762b13445cd485369c1e3389" }
plotter-input-plantuml = { git = "https://github.com/notedge/document.rs", rev = "4e15d61abe00cc85762b13445cd485369c1e3389" }
plotter-runtime = { git = "https://github.com/notedge/document.rs", rev = "4e15d61abe00cc85762b13445cd485369c1e3389" }
plotter-scene = { git = "https://github.com/notedge/document.rs", rev = "4e15d61abe00cc85762b13445cd485369c1e3389" }
plotter-types = { git = "https://github.com/notedge/document.rs", rev = "4e15d61abe00cc85762b13445cd485369c1e3389" }
document-diagnostic = { git = "https://github.com/notedge/document.rs", rev = "4e15d61abe00cc85762b13445cd485369c1e3389", default-features = false }
document-ir = { git = "https://github.com/notedge/document.rs", rev = "4e15d61abe00cc85762b13445cd485369c1e3389" }
document-types = { git = "https://github.com/notedge/document.rs", rev = "4e15d61abe00cc85762b13445cd485369c1e3389" }

# External dependencies
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-derive = "3.6.12"

[profile.release]
lto = true
opt-level = "s"

[workspace.metadata.release]
push = false
tag = false
