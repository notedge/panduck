[workspace]
resolver = "2"
members = ["projects/crates/*"]
default-members = [
    "projects/crates/panduck",
    "projects/crates/panduck-types",
    "projects/crates/panduck-convert",
    "projects/crates/panduck-napi",
]

[workspace.package]
version = "0.0.17"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"
edition = "2024"

[workspace.dependencies]
# Overlaid by local path `.cargo/config.toml` (git ignored).
boost-diagnostic = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86", default-features = false, features = ["std", "serde"] }
boost-log = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86" }
# Overlaid by local path `.cargo/config.toml` (git ignored).
panduck = { path = "projects/crates/panduck" }
panduck-types = { path = "projects/crates/panduck-types" }
panduck-diagnostic = { path = "projects/crates/panduck-diagnostic" }
panduck-convert = { path = "projects/crates/panduck-convert" }
panduck-napi = { path = "projects/crates/panduck-napi" }
panduck-wasm = { path = "projects/crates/panduck-wasm" }
# Overlaid by local path `.cargo/config.toml` (git ignored).
notedown-ir = { git = "https://github.com/notedge/notedown.git", branch = "dev" }
notedown-formats = { git = "https://github.com/notedge/notedown.git", branch = "dev", default-features = false, features = ["markdown", "notedown", "docx", "doc", "pdf", "epub", "html"] }
notedown-fixtures = { git = "https://github.com/notedge/notedown.git", branch = "dev" }

# External dependencies
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = { version = "2.5.7", features = ["serde"] }
source-map = "0.15.0"
byteorder = "1.5.0"
blake3 = "1.8.7"
wasm-bindgen = "0.2.129"
napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-derive = "3.6.12"

[profile.release]
lto = true
opt-level = "s"

[workspace.metadata.release]
push = false
tag = false
