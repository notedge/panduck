[workspace]
edition = "2021"
resolver = "2"
members = ["projects/crates/*"]
default-members = [
	"projects/crates/panduck-types",
	"projects/crates/panduck-napi",
]

[workspace.dependencies]
panduck-types = { path = "projects/crates/panduck-types" }
panduck-markdown = { path = "projects/crates/panduck-markdown" }
panduck-org = { path = "projects/crates/panduck-org" }
panduck-rst = { path = "projects/crates/panduck-rst" }
panduck-tex = { path = "projects/crates/panduck-tex" }
panduck-napi = { path = "projects/crates/panduck-napi" }
panduck-wasm = { path = "projects/crates/panduck-wasm" }

# CI resolves git `branch = "dev"`. Local path overlay: `.cargo/config.toml` (gitignored).
oak-core = { git = "https://github.com/yggdrasil-language/oaks.git", branch = "dev", package = "oak-core" }
oak-navigation = { git = "https://github.com/yggdrasil-language/oaks.git", branch = "dev", package = "oak-navigation" }
oak-markdown = { git = "https://github.com/yggdrasil-language/oaks.git", branch = "dev", package = "oak-markdown", default-features = false, features = ["serde"] }
oak-rst = { git = "https://github.com/yggdrasil-language/oaks.git", branch = "dev", package = "oak-rst", default-features = false, features = ["serde"] }

[profile.release]
lto = true
opt-level = "s"

[workspace.metadata.release]
push = false
tag = false
