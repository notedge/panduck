[package]
name = "panduck-napi"
version.workspace = true
description = "Node-API bindings for Panduck document conversion"
readme = "readme.md"
homepage = "https://github.com/notedge/panduck"
repository = "https://github.com/notedge/panduck"
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
document-convert = { workspace = true, features = ["logger"] }
document-types = { workspace = true }
oak-core = { workspace = true }
oak-notedown = { workspace = true }
oak-markdown = { workspace = true }
oak-html = { workspace = true }
oak-xml = { workspace = true }
plotter-diagram = { workspace = true }
plotter-input-dot = { workspace = true }
plotter-input-mermaid = { workspace = true }
plotter-input-plantuml = { workspace = true }
plotter-types = { workspace = true }
boost-diagnostic = { workspace = true }
boost-log = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
boost-log = { workspace = true }
serial_test = "3.2.0"

[build-dependencies]
napi-build = "2"

[package.metadata.napi]
name = "panduck"
