[package]
name = "panduck-diagnostic"
version.workspace = true
authors.workspace = true
description = "Panduck domain diagnostic codes on the shared diagnostic contract"
license.workspace = true
edition.workspace = true
readme = "readme.md"

[dependencies]
boost-diagnostic = { workspace = true }
boost-log = { workspace = true, optional = true }
notedown-ir = { workspace = true }
panduck-types = { workspace = true }

[features]
default = []
logger = ["dep:boost-log", "boost-diagnostic/log"]

[dev-dependencies]
serde_json = { workspace = true }
serial_test = "3.2.0"

[[test]]
name = "logger_emit"
required-features = ["logger"]
