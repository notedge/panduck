[package]
name = "panduck-diagnostic"
version.workspace = true
authors.workspace = true
description = "Panduck domain diagnostic codes on the shared diagnostic contract"
license.workspace = true
edition.workspace = true
readme = "readme.md"

[dependencies]
diagnostic = { git = "https://github.com/oovm/rust-boost", branch = "dev", package = "diagnostic", default-features = false, features = ["std", "serde"] }
logger = { workspace = true, optional = true }
notedown-ir = { workspace = true }
panduck-types = { workspace = true }

[features]
default = []
logger = ["dep:logger", "diagnostic/console"]
console = ["logger"]

[dev-dependencies]
serde_json = { workspace = true }
serial_test = "3.2.0"

[[test]]
name = "logger_emit"
required-features = ["logger"]
