[package]
name = "panduck-rst"
version = "0.1.0"
authors = ["Aster <192607617@qq.com>"]
description = "Conversion tool by rust, inspired by pandoc"
categories = ["rust-patterns"]
homepage = "https://github.com/oovm/panduck"
repository = "https://github.com/oovm/panduck"
documentation = "https://docs.rs/panduck-types"
readme = "readme.md"
license = "MPL-2.0"
edition = "2024"
exclude = ["package.json", "tests/**"]

[dependencies]
panduck-types = { workspace = true }
url = { version = "2.5.7", features = ["serde"] }
source-map = "0.15.0"
byteorder = "1.5.0"
tracing = "0.1.40"
serde = { version = "1.0", features = ["derive"] }


[dev-dependencies]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
