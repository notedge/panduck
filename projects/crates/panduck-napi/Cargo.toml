[package]
name = "panduck-napi"
version = "0.2.0"
authors = ["Aster <192607617@qq.com>"]
description = "Node-API bindings for Panduck document conversion"
license = "MPL-2.0"
edition = "2021"
readme = "readme.md"
homepage = "https://github.com/notedge/panduck"
repository = "https://github.com/notedge/panduck"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
panduck-convert = { workspace = true }
panduck-types = { workspace = true }

[build-dependencies]
napi-build = "2"

[package.metadata.napi]
name = "panduck"
