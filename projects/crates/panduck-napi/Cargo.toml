[package]

name = "panduck-napi"

version = "0.2.0"

description = "Node-API bindings for Panduck document conversion"

readme = "readme.md"

homepage = "https://github.com/notedge/panduck"

repository = "https://github.com/notedge/panduck"

authors.workspace = true

license.workspace = true

edition.workspace = true



[lib]

crate-type = ["cdylib", "rlib"]



[dependencies]

napi = { workspace = true }

napi-derive = { workspace = true }

panduck-convert = { workspace = true }

panduck-docx = { workspace = true }

panduck-types = { workspace = true }

serde_json = { workspace = true }



[build-dependencies]

napi-build = "2"



[package.metadata.napi]

name = "panduck"

