[package]

name = "panduck-convert"

description = "Panduck conversion orchestration over notedown-ir"

publish = false

version.workspace = true

authors.workspace = true

license.workspace = true

edition.workspace = true



[dependencies]

panduck-types = { workspace = true }
panduck-diagnostic = { workspace = true }

acorn-core = { workspace = true }
acorn-docx = { workspace = true }

notedown-ir = { workspace = true }
notedown-formats = { workspace = true }

serde = { workspace = true }

serde_json = { workspace = true }



[features]
default = []
console = ["panduck-diagnostic/console"]



[dev-dependencies]
console = { workspace = true }
serial_test = "3.2.0"

[[test]]
name = "console_failure"
required-features = ["console"]

[[test]]
name = "console_success"
required-features = ["console"]

