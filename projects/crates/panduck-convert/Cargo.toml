[package]

name = "panduck-convert"

description = "Panduck conversion orchestration over notedown-ir"

publish = false

version.workspace = true

authors.workspace = true

license.workspace = true

edition.workspace = true



[dependencies]

boost-diagnostic = { workspace = true }
panduck-types = { workspace = true }
panduck-diagnostic = { workspace = true }

notedown-ir = { workspace = true }
notedown-formats = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }



[features]
default = []
logger = ["panduck-diagnostic/logger"]
console = ["logger"]



[dev-dependencies]
boost-log = { workspace = true }
notedown-fixtures = { git = "https://github.com/notedge/notedown.git", branch = "dev" }
serial_test = "3.2.0"

[[test]]
name = "logger_failure"
required-features = ["logger"]

[[test]]
name = "logger_success"
required-features = ["logger"]

[[test]]
name = "publish_output"

